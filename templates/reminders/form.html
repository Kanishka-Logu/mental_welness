{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-5">
                <h2 class="card-title fw-bold mb-4"><i class="fas fa-bell text-primary me-2"></i>Add Reminder</h2>
                <form method="POST">
                    {% csrf_token %}
                    <fieldset class="form-group mb-4">
                        <div class="mb-3">
                            <label for="id_title" class="form-label">Reminder Name</label>
                            {{ form.title }}
                            <div class="form-text">e.g., Log Mood, Evening Meditation, Drink Water...</div>
                        </div>
                        <div class="mb-3">
                            <label for="id_time" class="form-label">Time</label>
                            {{ form.time }}
                        </div>
                        <div class="form-check form-switch mb-4">
                            {{ form.is_active }}
                            <label class="form-check-label" for="id_is_active">Reminder Active</label>
                        </div>
                    </fieldset>
                    <div class="form-group d-flex justify-content-between">
                        <a href="{% url 'reminder_list' %}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                        <button class="btn btn-primary px-5 rounded-pill shadow-sm" type="submit">Save Reminder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
