{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5 mb-5">
    <div class="col-md-10 col-lg-8">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 px-4 pb-0 d-flex justify-content-between align-items-center">
                 <h2 class="fw-bold mb-0 text-primary"><i class="fas fa-edit me-2"></i>{{ title }}</h2>
                 <a href="{% url 'journal_list' %}" class="btn btn-sm btn-outline-secondary rounded-pill px-3 shadow-sm bg-white hover-elevate border-0"><i class="fas fa-arrow-left me-2"></i>Back</a>
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="{{ form.title.id_for_label }}" class="form-label fw-bold text-dark fs-5"><i class="fas fa-heading text-info me-2"></i>Title</label>
                        {{ form.title }}
                        {% if form.title.errors %}
                            <div class="text-danger small mt-1">{{ form.title.errors }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="mb-4">
                        <label for="{{ form.content.id_for_label }}" class="form-label fw-bold text-dark fs-5"><i class="fas fa-align-left text-success me-2"></i>Your Thoughts</label>
                        {{ form.content }}
                        {% if form.content.errors %}
                            <div class="text-danger small mt-1">{{ form.content.errors }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="d-flex justify-content-end mt-4 pt-3 border-top border-light">
                        <a href="{% url 'journal_list' %}" class="btn btn-link text-muted me-3 text-decoration-none py-2 px-4 hover-elevate">Cancel</a>
                        <button class="btn btn-primary rounded-pill py-2 px-5 fw-bold shadow-sm hover-elevate" type="submit">
                            <i class="fas fa-save me-2"></i>Save Entry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
