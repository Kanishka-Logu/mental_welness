{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-10 col-lg-8">
        <div class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-body p-5">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-light">
                    <h2 class="fw-bold mb-0 text-dark"><i class="fas fa-bookmark text-warning me-3"></i>{{ entry.title }}</h2>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-primary rounded-pill px-3 shadow-sm hover-elevate btn-sm" href="{% url 'journal_update' entry.pk %}"><i class="fas fa-edit me-2"></i>Edit</a>
                        <a class="btn btn-outline-danger rounded-pill px-3 shadow-sm hover-elevate btn-sm" href="{% url 'journal_delete' entry.pk %}"><i class="fas fa-trash-alt me-2"></i>Delete</a>
                    </div>
                </div>
                
                <div class="d-flex align-items-center mb-4 text-muted">
                    <i class="far fa-clock me-2"></i>
                    <small>Written on {{ entry.date|date:"F j, Y, g:i a" }}</small>
                </div>

                <div class="fs-5 text-dark lh-lg">
                    {{ entry.content|linebreaks }}
                </div>
            </div>
            <div class="card-footer bg-light border-0 py-3 rounded-bottom-4 px-5 d-flex justify-content-between">
                <a href="{% url 'journal_list' %}" class="btn btn-link text-muted text-decoration-none px-0"><i class="fas fa-arrow-left me-2"></i>Back to Journal</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
