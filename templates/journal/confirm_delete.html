{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 text-center p-5">
            <i class="fas fa-exclamation-triangle text-warning fs-1 mb-4"></i>
            <h3 class="fw-bold mb-3">Delete Confirmation</h3>
            <p class="text-muted mb-4 pb-3 border-bottom border-light">Are you sure you want to permanently delete the journal entry "<strong class="text-dark">{{ entry.title }}</strong>"? This action cannot be undone.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                     <button class="btn btn-outline-secondary rounded-pill px-4 shadow-sm hover-elevate" type="button" onclick="history.back()"><i class="fas fa-arrow-left me-2"></i>Cancel</button>
                     <button class="btn btn-danger rounded-pill px-4 shadow-sm hover-elevate fw-bold" type="submit"><i class="fas fa-trash-alt me-2"></i>Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
